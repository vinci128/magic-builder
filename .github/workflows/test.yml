name: tests

# The suite is hermetic: committed fixtures, no network, no Scryfall cache, no API keys. It runs in
# under a second, which is the point — a check slow enough to skip is a check that gets skipped.
#
# Runs on both branches: `main` is what people land on, `dev` is where the work happens, and a red
# result on either should be visible before it reaches the other.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject, and the next one up: an install that works on the author's
        # interpreter and not on a newer one is a failure you only find from a user.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: The parsers
        run: python -m pytest -q

      - name: The wheel contains what the package contains
        # The bug this catches shipped once already: a package data file matched a .gitignore rule, so
        # hatchling left it out of the wheel and --demo broke for everyone who installed the package,
        # while passing every test in a checkout.
        run: python tests/check_wheel.py

  fresh-install:
    # A separate job because it asks a different question: not "is the code right" but "can a stranger
    # start". It installs from a clean checkout and builds a deck with no personal collection, no
    # network, and no EDHREC pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install, as a user would
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Version and demo work from an install
        # --demo reads a file that ships inside the package, which is exactly what a .gitignore rule or
        # a packaging default can silently drop. It gets its own step because a failure here is
        # invisible to every other check.
        run: |
          set -euo pipefail
          magic-builder --version | grep -q "^magic-builder "
          magic-builder --demo --no-recs -o /tmp/demo.txt
          total=$(awk '{s+=$1} END {print s}' /tmp/demo.decklist.txt)
          echo "demo deck: $total cards"
          test "$total" -eq 100

      - name: The cache stays out of the working directory
        # It used to default to ./.cache, so the tool dropped 80 MB into whatever directory it ran from
        # and re-downloaded there. Silent when it works, which is why it is checked.
        run: |
          set -euo pipefail
          mkdir -p /tmp/elsewhere
          cd /tmp/elsewhere
          python -c "from magic_builder import paths; print(paths.CACHE_ROOT)"
          if [ -d /tmp/elsewhere/.cache ]; then
            echo "::error::the tool created a .cache in the working directory"
            exit 1
          fi

      - name: Build a deck from the committed fixture
        run: |
          set -euo pipefail
          magic-builder tests/fixtures/collection_arena.txt --no-recs -o /tmp/deck.txt
          test -s /tmp/deck.txt
          # A Commander deck is exactly 100 cards, and the decklist is the machine-readable half.
          test -f /tmp/deck.decklist.txt
          total=$(awk '{s+=$1} END {print s}' /tmp/deck.decklist.txt)
          echo "deck size: $total"
          test "$total" -eq 100

      - name: A file in no known format is refused
        # The failure worth guarding: a wrong file used to be parsed as an Arena export and reported as
        # "Found 0 unique card(s)", which reads as a fact about the collection instead of about the file.
        run: |
          set -euo pipefail
          printf 'alpha,beta\n1,2\n' > /tmp/weird.csv
          if magic-builder /tmp/weird.csv --no-recs -o /tmp/nope.txt 2>/tmp/err.txt; then
            echo "::error::a file in no known format was accepted"
            exit 1
          fi
          cat /tmp/err.txt
          grep -q "is not a collection file I recognise" /tmp/err.txt

      - name: A missing collection file says what to do
        # The first thing anyone runs is the bare command, in a directory with no export in it.
        run: |
          set -euo pipefail
          mkdir -p /tmp/empty
          cd /tmp/empty
          if magic-builder 2>/tmp/nf.txt; then
            echo "::error::running with no collection file succeeded"
            exit 1
          fi
          cat /tmp/nf.txt
          if grep -q "Traceback" /tmp/nf.txt; then
            echo "::error::a traceback reached the user"
            exit 1
          fi
          grep -q -- "--demo" /tmp/nf.txt
