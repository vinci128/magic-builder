[project]
name = "magic-builder"
version = "0.1.0"
description = "Build Commander, Brawl, Standard and Pauper decks from the cards you own"
readme = "README.md"
# The SPDX expression, not `{ file = "LICENSE" }`. Pointing at the file copies its entire text into the
# metadata, and PyPI renders that as a wall of licence in the sidebar instead of saying "MIT".
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Matches the LICENSE and the GitHub handle. Change it here and PyPI shows the new one on the next
# release only — an upload's metadata is permanent.
authors = [{ name = "vinci128" }]
keywords = ["mtg", "magic-the-gathering", "commander", "edh", "deck-building", "scryfall", "manabox"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "mcp>=1.0",
    "requests>=2.31",
    "pyedhrec>=0.0.2",
]

[project.scripts]
magic-builder = "magic_builder.cli:main"
magic-builder-web = "magic_builder.web.app:main"
magic-builder-mcp = "magic_builder.mcp_server:main"

[project.urls]
Homepage = "https://github.com/vinci128/magic-builder"
Repository = "https://github.com/vinci128/magic-builder"
Issues = "https://github.com/vinci128/magic-builder/issues"

[project.optional-dependencies]
# The test suite. Separate from the runtime deps because nothing it needs ships to a user: the parser
# tests are hermetic (committed fixtures, no network, no Scryfall cache) and take under a second.
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magic_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/build_fixtures.py is a generator, not a test module: it talks to the Scryfall cache and would
# try to collect the `CARDS` list as tests. Excluded by name so the suite stays hermetic.
addopts = "--import-mode=importlib"
python_files = ["test_*.py"]
# A warning is a finding here, not noise: the parsers warn when they drop a row, and a suite that
# tolerates warnings will not notice when that starts happening.
filterwarnings = ["error::UserWarning:magic_builder.*"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["magic_builder"]
combine-as-imports = true
